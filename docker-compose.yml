version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: revenuelens
      POSTGRES_PASSWORD: revenuelens
      POSTGRES_DB: revenuelens
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "revenuelens"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://revenuelens:revenuelens@postgres:5432/revenuelens
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
