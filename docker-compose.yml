services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: revenuelens
      POSTGRES_DB: revenuelens
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "revenuelens"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://revenuelens:${DB_PASSWORD}@db:5432/revenuelens
      COMPANY_ID: ${COMPANY_ID:?}
      COMPANY_NAME: ${COMPANY_NAME:?}
      JWT_SECRET: ${JWT_SECRET:?}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      LEGACY_DATABASE_URL: postgresql://nimbus:${LEGACY_DB_PASSWORD:-nimbus-dev-only}@legacy-db:5432/nimbus
      RL_LLM: ${RL_LLM:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - edge

  legacy-db:
    image: postgres:16
    environment:
      POSTGRES_USER: nimbus
      POSTGRES_DB: nimbus
      POSTGRES_PASSWORD: ${LEGACY_DB_PASSWORD:-nimbus-dev-only}
    volumes:
      - legacy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nimbus"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    profiles:
      - legacy-sim

  legacy-sim:
    build: .
    command: python -m legacy_sim load --seed ${LEGACY_SEED:-42} --customers 500
    environment:
      LEGACY_DATABASE_URL: postgresql://nimbus:${LEGACY_DB_PASSWORD:-nimbus-dev-only}@legacy-db:5432/nimbus
    depends_on:
      legacy-db:
        condition: service_healthy
    restart: "no"
    networks:
      - internal
    profiles:
      - legacy-sim

networks:
  internal:
    internal: true
  edge:
    driver: bridge

volumes:
  pgdata:
  legacy_pgdata:
