[project]
name = "revenuelens"
requires-python = ">=3.12"
version = "0.1.0"
description = "RevenueLens FastAPI service"
authors = [{name = "Your Name", email = "you@example.com"}]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary]>=3.1",
    "bcrypt",
    "PyJWT",
    "jinja2",
    "python-multipart",
    "duckdb",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app", "legacy_sim"]
package-data = {"legacy_sim" = ["schema.sql"], "app" = ["templates/*.html"]}
