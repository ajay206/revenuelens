name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: revenuelens
          POSTGRES_PASSWORD: revenuelens
          POSTGRES_DB: revenuelens
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U revenuelens"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql://revenuelens:revenuelens@localhost:5432/revenuelens
        run: pytest -q

  e2e:
    runs-on: ubuntu-latest
    needs: []   # independent job
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run end‑to‑end tests
        env:
          # Ensure Docker Compose v2 is available (Docker already installed on runner)
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: bash scripts/e2e.sh

  demo:
    runs-on: ubuntu-latest
    needs: []   # independent job
    steps:
      - uses: actions/checkout@v4

      - name: Run demo smoke test
        run: bash scripts/demo-smoke.sh
