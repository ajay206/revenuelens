name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: revenuelens
          POSTGRES_PASSWORD: revenuelens
          POSTGRES_DB: revenuelens
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U revenuelens"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql://revenuelens:revenuelens@localhost:5432/revenuelens
        run: pytest -q
